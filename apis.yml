aid: spire-maritime
url: https://raw.githubusercontent.com/api-evangelist/spire-maritime/refs/heads/main/apis.yml
name: Spire Maritime
kind: company
description: >-
  Spire Maritime (Spire Global) delivers satellite and terrestrial AIS vessel
  data - global ship positions, static vessel characteristics, voyage and
  destination data, port events, and predicted ETAs. The flagship Maritime 2.0
  service is GraphQL-first at a single endpoint (https://api.spire.com/graphql,
  Bearer token auth), with a separate raw-TCP AIS stream for real-time message
  delivery in NMEA 0183 format. Access is enterprise / contact-sales. NOTE -
  following Spire Maritime's acquisition by Kpler, these APIs are being
  migrated/discontinued; new integrations are directed to developers.kpler.com.
accessModel:
  pricing: enterprise
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Enterprise · Self-serve signup

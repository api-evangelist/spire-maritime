meters:
- name: data_subscription
  description: Committed annual license to Spire Maritime data products (contract-defined scope). No public per-unit rate.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - product
- name: graphql_requests
  description: Maritime 2.0 GraphQL requests (quota ~60 req/min per token); usage governed by agreement, not public per-call price.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - token
- name: stream_throughput
  description: Real-time AIS messages delivered over the raw TCP stream; scoped by licensed coverage/throughput.
  unit: messages
  aggregation: sum
  dimensions:
  - account
- name: historical_extracts
  description: Custom historical AIS / events data extracts delivered as datasets.
  unit: datasets
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track which data products, coverage, and delivery channels are licensed; monitor GraphQL request volume via extensions.requestQuota.
- name: Allocation
  description: Map each Spire token / stream to a workload or team so the annual subscription cost allocates to internal cost centers.
- name: Optimization
  description: Query only required GraphQL fields to cut payload; scope AOI/time filters tightly; prefer the TCP stream for continuous needs and the GraphQL API for targeted lookups rather than duplicating both.
- name: Accountability
  description: Assign an owner for the Spire/Kpler agreement; review licensed scope vs. actual usage before each renewal.

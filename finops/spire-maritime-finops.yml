- FOCUS
description: >-
  FinOps view of Spire Maritime spend. Spire Maritime is sold via enterprise /
  contact-sales agreements, not public usage-based rates, so cost is driven by
  the licensed data products (vessels, messages, port events, predicted ETA,
  historical extracts), the coverage (satellite + terrestrial AIS), the delivery
  channels used (GraphQL API and/or the raw TCP AIS stream), and the contracted
  request/throughput scope - typically a committed annual subscription rather
  than metered per-call billing. No public per-unit prices are asserted here.
notes: >-
  No published rate card; all figures are contract-specific. Following Spire
  Maritime's acquisition by Kpler, invoicing and commercial terms are handled
  through Kpler. Reconcile against an actual Spire/Kpler agreement.
sources:
- https://spire.com/maritime/
- https://documentation.spire.com/maritime-2-0/
- https://focus.finops.org/focus-specification/v1-3/
